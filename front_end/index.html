<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask Data</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f2f5f3;
      --surface: #ffffff;
      --ink: #172b2a;
      --muted: #5b706d;
      --line: #d6e0dc;
      --green: #087e6b;
      --green-dark: #056556;
      --red: #9f3428;
      --red-bg: #fff0ed;
      --shadow: 0 12px 34px rgba(27, 54, 48, .07);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image: linear-gradient(135deg, rgba(8, 126, 107, .045) 25%, transparent 25%),
        linear-gradient(315deg, rgba(221, 237, 210, .42) 25%, transparent 25%);
      background-size: 32px 32px;
      font-family: "IBM Plex Sans", "Source Sans Pro", "Segoe UI", sans-serif;
    }
    main { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 25px 0 64px; }
    nav { display: flex; gap: 22px; border-bottom: 1px solid var(--line); padding: 0 0 15px; }
    nav a { color: var(--muted); font-size: .92rem; font-weight: 650; text-decoration: none; }
    nav a[aria-current="page"] { color: var(--green); }
    header { display: flex; align-items: end; justify-content: space-between; gap: 20px; padding: 34px 0 26px; }
    .eyebrow { color: var(--green); font-size: .74rem; font-weight: 750; text-transform: uppercase; letter-spacing: .08em; }
    h1 { margin: 7px 0 0; font-family: Georgia, "Times New Roman", serif; font-size: 2.2rem; line-height: 1.08; font-weight: 500; }
    h2 { margin: 0 0 14px; font-family: Georgia, "Times New Roman", serif; font-size: 1.4rem; font-weight: 500; }
    header p { max-width: 430px; margin: 0; color: var(--muted); line-height: 1.5; }
    .meta { margin: 0 0 16px; color: var(--muted); font-size: .88rem; }
    .meta code { padding: 3px 7px; border-radius: 3px; background: #e7eeea; color: var(--ink); overflow-wrap: anywhere; }
    .ask-panel, .card { background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
    .ask-panel { margin: 0 0 18px; padding: 20px; }
    form { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 12px; }
    label { display: block; margin-bottom: 7px; color: var(--muted); font-size: .78rem; font-weight: 700; }
    .field { min-width: 0; }
    input[type="text"] {
      width: 100%; min-height: 43px; padding: 9px 12px;
      border: 1px solid #bdcbc6; border-radius: 4px;
      color: var(--ink); background: white; font: inherit;
    }
    input[type="text"]:focus, button:focus-visible { outline: 2px solid #7ca99c; outline-offset: 2px; }
    button {
      width: 48px; height: 43px; border: 1px solid var(--green); border-radius: 4px;
      background: var(--green); color: white; font-size: 1.2rem; cursor: pointer;
    }
    button:hover { background: var(--green-dark); }
    button:disabled { opacity: .58; cursor: wait; }
    .card { border-radius: 5px; padding: 18px 20px; margin-bottom: 16px; }
    .error { border-color: #e8b6ad; color: var(--red); background: var(--red-bg); }
    .hidden { display: none; }
    #assistant { overflow-wrap: anywhere; }
    #assistant table { width: 100%; border-collapse: collapse; font-size: .95rem; }
    #assistant th, #assistant td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
    #assistant th { background: #f1f6f3; color: #335a50; }
    pre { margin: 0; white-space: pre-wrap; word-break: break-word; }
    #assistant p { margin: 0 0 10px; }
    #assistant ul, #assistant ol { margin: 0 0 10px; padding-left: 1.25rem; }
    #assistant li { margin: 4px 0; }
    #assistant p:last-child, #assistant ul:last-child, #assistant ol:last-child, #assistant table:last-child { margin-bottom: 0; }
    #assistant table { margin-top: 4px; }
    @media (max-width: 720px) {
      main { width: min(calc(100% - 28px), 600px); padding-top: 18px; }
      header { display: block; padding-top: 26px; }
      header p { margin-top: 12px; }
      .ask-panel, .card { padding: 16px; }
      form { grid-template-columns: 1fr auto; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <nav aria-label="Main navigation">
      <a href="/" aria-current="page">Ask data</a>
      <a href="/relationships">Relationship mappings</a>
    </nav>
    <header>
      <div>
        <div class="eyebrow">Natural language query</div>
        <h1>Ask Your Data</h1>
      </div>
      <p>Explore your database with a question. Responses use the configured semantic model and saved relationships.</p>
    </header>
    <p class="meta">Connected database <code id="database-uri">…</code></p>
    <section class="ask-panel">
      <form id="ask-form">
        <div class="field">
          <label for="prompt">Your question</label>
          <input id="prompt" type="text" placeholder="Which courses did Tom take?" autocomplete="off" required>
        </div>
        <button id="submit" type="submit" title="Submit your question">➜</button>
      </form>
    </section>
    <section id="error" class="card error hidden"></section>
    <section id="assistant-card" class="card hidden">
      <h2>AI Assistant Response</h2>
      <div id="assistant"></div>
    </section>
  </main>
  <script>
    const form = document.getElementById("ask-form");
    const promptInput = document.getElementById("prompt");
    const submitButton = document.getElementById("submit");
    const errorBox = document.getElementById("error");
    const assistantCard = document.getElementById("assistant-card");
    const assistantBox = document.getElementById("assistant");

    function show(el) { el.classList.remove("hidden"); }
    function hide(el) { el.classList.add("hidden"); }

    function renderTable(rows) {
      const columns = [...new Set(rows.flatMap((row) => Object.keys(row)))];
      const table = document.createElement("table");
      const thead = document.createElement("thead");
      const headRow = document.createElement("tr");
      columns.forEach((column) => {
        const th = document.createElement("th");
        th.textContent = column;
        headRow.appendChild(th);
      });
      thead.appendChild(headRow);
      table.appendChild(thead);
      const tbody = document.createElement("tbody");
      rows.forEach((row) => {
        const tr = document.createElement("tr");
        columns.forEach((column) => {
          const td = document.createElement("td");
          const value = row[column];
          td.textContent = value == null ? "" : String(value);
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      return table;
    }

    function isTableRow(line) {
      const trimmed = line.trim();
      return trimmed.startsWith("|") && trimmed.endsWith("|") && trimmed.length > 1;
    }

    function isSeparatorRow(line) {
      return /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line);
    }

    function parseTableCells(line) {
      let trimmed = line.trim();
      if (trimmed.startsWith("|")) trimmed = trimmed.slice(1);
      if (trimmed.endsWith("|")) trimmed = trimmed.slice(0, -1);
      const cells = [];
      let current = "";
      for (let i = 0; i < trimmed.length; i += 1) {
        if (trimmed[i] === "\\" && trimmed[i + 1] === "|") {
          current += "|";
          i += 1;
          continue;
        }
        if (trimmed[i] === "|") {
          cells.push(current.trim());
          current = "";
          continue;
        }
        current += trimmed[i];
      }
      cells.push(current.trim());
      return cells;
    }

    function renderMarkdownTable(lines) {
      const header = parseTableCells(lines[0]);
      const records = lines.slice(2).filter(isTableRow).map((line) => {
        const cells = parseTableCells(line);
        const record = {};
        header.forEach((column, index) => {
          record[column || "col" + (index + 1)] = cells[index] == null ? "" : cells[index];
        });
        return record;
      });
      if (!records.length) {
        const empty = {};
        header.forEach((column, index) => {
          empty[column || "col" + (index + 1)] = "";
        });
        return renderTable([empty]);
      }
      return renderTable(records);
    }

    function isListLine(line) {
      return /^\s*(?:[-*+]|\d+[.)])\s+\S/.test(line);
    }

    function renderList(lines) {
      const ordered = lines.every((line) => /^\s*\d+[.)]\s+/.test(line));
      const list = document.createElement(ordered ? "ol" : "ul");
      lines.forEach((line) => {
        const item = document.createElement("li");
        item.textContent = line.replace(/^\s*(?:[-*+]|\d+[.)])\s+/, "").trim();
        list.appendChild(item);
      });
      return list;
    }

    function renderStructuredValue(value) {
      const isRecord = (item) => item && typeof item === "object" && !Array.isArray(item);
      if (Array.isArray(value)) {
        if (value.length && value.every(isRecord)) {
          const keys = new Set(value.flatMap((row) => Object.keys(row)));
          if (keys.size > 1) return renderTable(value);
          const list = document.createElement("ul");
          value.forEach((row) => {
            const item = document.createElement("li");
            item.textContent = String(Object.values(row)[0] ?? "");
            list.appendChild(item);
          });
          return list;
        }
        const list = document.createElement("ul");
        value.forEach((entry) => {
          const item = document.createElement("li");
          item.textContent = entry != null && typeof entry === "object"
            ? JSON.stringify(entry)
            : String(entry);
          list.appendChild(item);
        });
        return list;
      }
      if (isRecord(value)) {
        const entries = Object.entries(value);
        if (entries.length === 1 && (entries[0][1] == null || typeof entries[0][1] !== "object")) {
          const paragraph = document.createElement("p");
          paragraph.textContent = entries[0][0] + ": " + entries[0][1];
          return paragraph;
        }
        return renderTable([value]);
      }
      const paragraph = document.createElement("p");
      paragraph.textContent = String(value);
      return paragraph;
    }

    function renderAssistant(text) {
      assistantBox.replaceChildren();
      const trimmed = (text || "").trim();
      if (!trimmed) {
        hide(assistantCard);
        return;
      }
      if (
        (trimmed.startsWith("{") && trimmed.endsWith("}"))
        || (trimmed.startsWith("[") && trimmed.endsWith("]"))
      ) {
        try {
          assistantBox.appendChild(renderStructuredValue(JSON.parse(trimmed)));
          show(assistantCard);
          return;
        } catch (err) {
          /* plain text that happens to start with a bracket */
        }
      }

      const lines = trimmed.split(/\r?\n/);
      let index = 0;
      while (index < lines.length) {
        if (!lines[index].trim()) {
          index += 1;
          continue;
        }
        if (isTableRow(lines[index]) && index + 1 < lines.length && isSeparatorRow(lines[index + 1])) {
          const tableLines = [lines[index], lines[index + 1]];
          index += 2;
          while (index < lines.length && isTableRow(lines[index])) {
            tableLines.push(lines[index]);
            index += 1;
          }
          assistantBox.appendChild(renderMarkdownTable(tableLines));
          continue;
        }
        if (isListLine(lines[index])) {
          const listLines = [];
          while (index < lines.length && (isListLine(lines[index]) || !lines[index].trim())) {
            const nextIsItem = index + 1 < lines.length && isListLine(lines[index + 1]);
            if (!lines[index].trim() && !nextIsItem) break;
            if (lines[index].trim()) listLines.push(lines[index]);
            index += 1;
          }
          if (listLines.length) assistantBox.appendChild(renderList(listLines));
          continue;
        }
        const paragraphLines = [];
        while (index < lines.length && lines[index].trim() && !isListLine(lines[index])) {
          const upcomingTable = isTableRow(lines[index])
            && index + 1 < lines.length
            && isSeparatorRow(lines[index + 1]);
          if (upcomingTable) break;
          paragraphLines.push(lines[index].trim());
          index += 1;
        }
        if (paragraphLines.length > 1) {
          assistantBox.appendChild(renderList(paragraphLines.map((line) => "- " + line)));
        } else if (paragraphLines.length === 1) {
          const paragraph = document.createElement("p");
          paragraph.textContent = paragraphLines[0];
          assistantBox.appendChild(paragraph);
        }
      }
      show(assistantCard);
    }

    async function loadInfo() {
      const response = await fetch("/api/info");
      if (!response.ok) return;
      const data = await response.json();
      document.getElementById("database-uri").textContent = data.database_uri;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const prompt = promptInput.value.trim();
      if (!prompt) return;
      hide(errorBox);
      submitButton.disabled = true;
      try {
        const response = await fetch("/api/query", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt }),
        });
        const data = await response.json();
        if (!response.ok) {
          hide(assistantCard);
          errorBox.textContent = data.detail || "Failed to process query";
          show(errorBox);
          return;
        }
        renderAssistant(data.assistant_text || "");
      } catch (err) {
        hide(assistantCard);
        errorBox.textContent = "Failed to process query: " + err.message;
        show(errorBox);
      } finally {
        submitButton.disabled = false;
      }
    });

    loadInfo();
  </script>
</body>
</html>
