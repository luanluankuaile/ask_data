# GitLab CI pipeline for ask_data
# Simplified version without tags - works with any available runner

stages:
  - test

test-simple:
  image: python:3.11-slim
  stage: test
  script:
    - echo "Testing basic Python setup..."
    - python --version
    - pip install --no-cache-dir -r back_end/requirements.txt || echo "Failed to install requirements"
    - echo "Build successful!"
  only:
    - main
  only:
    - main