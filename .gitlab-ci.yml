# GitLab CI pipeline for ask_data
# - Lint / build (Python) jobs
# - Docker build and push job (uses Docker-in-Docker)
# Configure these CI/CD variables in your project settings:
# - CI_REGISTRY_USER, CI_REGISTRY_PASSWORD (for docker login)

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DOCKER_IMAGE_TAG: "${CI_COMMIT_SHORT_SHA}"

stages:
  - lint
  - build
  - docker

lint-python:
  image: python:3.11-slim
  stage: lint
  script:
    - pip install --no-cache-dir -r requirements.txt || true
    - echo "No configured linter - add ruff/flake8 if desired"
  only:
    - branches

build-python:
  image: python:3.11-slim
  stage: build
  script:
    - pip install --no-cache-dir -r requirements.txt
    - if [ -f pytest.ini ] || [ -d tests ]; then pytest -q; else echo "No tests found"; fi
  artifacts:
    paths:
      - .cache/pip
    expire_in: 1h
  only:
    - branches

docker-build-and-push:
  stage: docker
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo "Logging into GitLab Container Registry..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Building Docker image..."
    - docker build -t $CI_REGISTRY_IMAGE:$DOCKER_IMAGE_TAG -t $CI_REGISTRY_IMAGE:latest .
    - echo "Pushing Docker image..."
    - docker push $CI_REGISTRY_IMAGE:$DOCKER_IMAGE_TAG
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    - main